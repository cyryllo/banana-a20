# RetroArch dla konsoli Banana Pro (tylko ustawienia rozne od domyslnych).
# Reszte RetroArch dopisze sam przy pierwszym wyjsciu (config_save_on_exit).

# Obraz: OpenGL ES przez KMS, bez X (sterownik lima, Mali-400)
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_vsync = "true"

# Menu XMB (jak w PS3/PSP i w Lakce, wybor uzytkownika 2026-11-10): obsluga padem
# i joystickiem. Zamiennik: Ozone (lista konsol po lewej). Dotyk w menu jest
# domyslnie wylaczony; gdyby go wlaczyc, lepiej dziala w Ozone i Material UI.
# Wybor menu: Settings -> User Interface -> Menu.
# Tlo "wstega uproszczona" (1) dla XMB: mniej pracy dla Mali-400.
menu_driver = "xmb"
# Czcionki menu: DejaVu Sans zamiast Roboto (podmiana w customize-konsola.sh),
# zeby klawiatura ekranowa miala klawisze specjalne we wszystkich menu.
# DLACZEGO bez "Quit RetroArch": na konsoli wyjscie z RetroArch nie jest potrzebne
# (sa Restart i Zamknij system), a przypadkowe stukniecie konczylo program.
menu_show_quit_retroarch = "false"
menu_shader_pipeline = "1"
content_show_images = "false"
content_show_music = "false"
content_show_video = "false"
content_show_netplay = "false"
playlist_directory = "/root/.config/retroarch/playlists"
# Dotyk w menu domyslnie WYLACZONY (decyzja uzytkownika 2026-11-12): konsola jest
# obslugiwana padem. RetroArch z master 4206fe8 ma poprawki tworcow do naszych
# zgloszen #20060 (dotyk w udev) i #20061 (rozmiar ekranu, DPI) i dotyk dziala
# (stukniecie, przewijanie, przesuwanie kategorii), ale uklad dotyku ekranow LeMaker
# potrafi sie po kilku godzinach rozkalibrowac i zasypac menu falszywymi punktami,
# az dotyk w menu sie zawiesi (pad dziala dalej). Reset ukladu przy kazdym starcie
# RetroArch: konsola-reset-dotyku. Wlaczenie: Settings -> User Interface -> Touch Support.
menu_pointer_enable = "false"
menu_show_core_updater = "false"
menu_show_online_updater = "false"

# Pady: udev, automatyczne profile; menu z pada: Start + Select
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
# DLACZEGO katalog nadrzedny: RetroArch sam dokleja nazwe sterownika (udev)
# przy odczycie i przy zapisie profilu pada (Save Controller Profile).
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"
input_menu_toggle_gamepad_combo = "4"

# Wi-Fi w menu (Ustawienia -> Wi-Fi) przez NetworkManager
wifi_driver = "nmcli"

# Dotyk na LCD: stukniecie trafia tam, gdzie palec (wskaznik bezwzgledny).
# DLACZEGO wylaczone mysz i touchpad: domyslnie dotyk udaje tez mysz w trybie
# touchpada, a menu RetroArch daje myszy pierwszenstwo ("Mouse takes precedence"),
# wiec palec przesuwal kursor wzglednie, a stukniecie klikalo w miejscu kursora.
input_touch_vmouse_pointer = "true"
input_touch_vmouse_mouse = "false"
input_touch_vmouse_touchpad = "false"
input_touch_vmouse_gesture = "false"
menu_mouse_enable = "false"

# Dzwiek
audio_driver = "alsa"

# Sciezki
libretro_directory = "/usr/lib/arm-linux-gnueabihf/libretro"
libretro_info_path = "/usr/share/libretro/info"
assets_directory = "/usr/share/libretro/assets"
content_database_path = "/usr/share/libretro/database/rdb"
rgui_browser_directory = "/home/roms"
system_directory = "/home/roms/bios"
savefile_directory = "/home/roms/zapisy"
savestate_directory = "/home/roms/zapisy"
screenshot_directory = "/home/roms/zrzuty"

config_save_on_exit = "true"

# Szczegolowy log do pliku (diagnoza padow, dotyku, obrazu):
# /root/.config/retroarch/logs/
log_verbosity = "true"
log_to_file = "true"
log_dir = "/root/.config/retroarch/logs"
